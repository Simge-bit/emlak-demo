<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danışmanlar | Ihlamur Gayrimenkul</title>
<meta name="description" content="Ihlamur Gayrimenkul danışmanları İstanbul, Urla ve Bodrum'da satılık ve kiralık evlerle ilgileniyor.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://simge-bit.github.io/emlak-demo/danismanlar.html">
<meta property="og:type" content="website">
<meta property="og:locale" content="tr_TR">
<meta property="og:site_name" content="Ihlamur Gayrimenkul">
<meta property="og:title" content="Danışmanlar | Ihlamur Gayrimenkul">
<meta property="og:description" content="Ihlamur Gayrimenkul danışmanları İstanbul, Urla ve Bodrum'da satılık ve kiralık evlerle ilgileniyor.">
<meta property="og:image" content="https://simge-bit.github.io/emlak-demo/img/ev-zekeriyakoy.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/schibsted-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="danismanlar">
<main>
  <header class="phead">
    <div class="crumb" data-reveal><a href="index.html">Ana sayfa</a> / Danışmanlar</div>
    <div>
      <h1 class="split">Danışmanlar</h1>
      <div class="sub" style="margin-top:30px" data-reveal><p>Her danışmanımız tek bir bölgede çalışır. Böylece o bölgedeki sokakları, binaları ve fiyatları yakından tanır.</p></div>
    </div>
  </header>

  <section class="wrap">
    <div class="team" id="team" style="margin-bottom:clamp(80px,10vw,150px)"></div>
    <div class="people" id="people"></div>
  </section>

  <section class="outro sec wrap" style="margin-top:clamp(80px,10vw,160px)"><div data-footer></div></section>
</main>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  const D = window.DATA;
  const sayi = (id) => D.ilanlar.filter((x) => x.danisman === id).length;
  document.getElementById("team").innerHTML = D.danismanlar.map((p, i) => `
    <a class="person" href="danisman.html?id=${p.id}">
      <div class="ph img-reveal" style="--d:${i * 90}ms"><img src="${p.foto}" alt="${p.ad}"></div>
      <div class="n">${p.ad}</div><div class="r">${p.unvan}</div>
    </a>`).join("");
  const people = document.getElementById("people");
  people.innerHTML = D.danismanlar.map((p, i) => `
    <a class="prow" href="danisman.html?id=${p.id}" data-img="${p.foto}" data-reveal style="--d:${i * 60}ms">
      <span class="label num">0${i + 1}</span><h3>${p.ad}</h3><span class="m">${p.bolge}</span><span class="m num">${sayi(p.id)} aktif ilan</span><span class="arr">→</span>
    </a>`).join("");
  floatImages(people, ".prow");
})();
</script>
</body>
</html>
