<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danışman | Ihlamur Gayrimenkul</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:locale" content="tr_TR">
<meta property="og:site_name" content="Ihlamur Gayrimenkul">
<meta property="og:title" content="Danışman | Ihlamur Gayrimenkul">
<meta property="og:description" content="Ihlamur Gayrimenkul İstanbul, Urla ve Bodrum'da satılık ve kiralık ev ilanları sunar.">
<meta property="og:image" content="https://simge-bit.github.io/emlak-demo/img/ev-zekeriyakoy.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/schibsted-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="danismanlar">
<main id="main"></main>

<script src="js/data.js"></script>
<script src="js/ofis.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  const D = window.DATA;
  const id = new URLSearchParams(location.search).get("id");
  const p = D.danismanlar.find((x) => x.id === id) || D.danismanlar[0];
  // Bu ofiste danışman yoksa ana sayfaya dönülür
  if (!p) { location.replace("index.html"); return; }
  const ilanlar = D.ilanlar.filter((x) => x.danisman === p.id);
  document.title = `${p.ad} | ${D.ofis.ad}`;
  const waText = encodeURIComponent(`Merhaba, ${p.ad} ile bir ev hakkında görüşmek istiyorum.`);

  document.getElementById("main").innerHTML = `
  <section class="profile wrap">
    <div class="ph img-reveal"><img src="${p.foto}" alt="${p.ad}"></div>
    <div class="info">
      <div>
        <div class="crumb" data-reveal><a href="index.html">Ana sayfa</a> / <a href="danismanlar.html">Danışmanlar</a> / ${p.ad}</div>
        <h1 class="split" style="margin-top:30px">${p.ad}</h1>
        <p class="bio split">${p.bio}</p>
      </div>
      <div>
        <dl data-reveal>
          <div><dt>Unvan</dt><dd>${p.unvan}</dd></div>
          <div><dt>Bölge</dt><dd>${p.bolge}</dd></div>
          <div><dt>Telefon</dt><dd class="num"><a class="ulink" href="tel:${p.tel.replace(/\s/g, "")}">${p.tel}</a></dd></div>
        </dl>
        <div class="acts" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:28px" data-reveal>
          <a class="btn" href="${waLink(decodeURIComponent(waText))}" target="_blank" rel="noopener"><span>WhatsApp ile yazın</span><span class="arr">→</span></a>
          <a class="btn line" href="iletisim.html"><span>Görüşme isteyin</span></a>
        </div>
      </div>
    </div>
  </section>

  <section class="sec wrap">
    <div class="sec-head">
      <div class="label" data-reveal>Portföy</div>
      <div class="side"><h2 class="split">Aktif ilanlar</h2><span class="label num">${ilanlar.length} ilan</span></div>
    </div>
    <div class="similar">${ilanlar.length
      ? ilanlar.map((x, i) => cardHTML(x, i).replace('class="card ', `data-reveal style="--d:${(i % 3) * 90}ms" class="card `)).join("")
      : `<p class="label">Bu danışmanın şu anda aktif ilanı yok.</p>`}</div>
  </section>

  <section class="outro sec wrap"><div data-footer></div></section>`;
})();
</script>
</body>
</html>
